events {
    worker_connections 1024;
}

http {
    # Definir el upstream para el backend Flask-SocketIO
    upstream backend_app {
        # Reemplaza 'backend' con el nombre de tu servicio Flask en docker-compose.yml
        # y '5000' con el puerto real de tu aplicación Flask/SocketIO.
        server backend:5000;
    }

    server {
        listen 80; # Nginx escucha HTTP en el puerto 80. Ngrok puede manejar el SSL.
        # Si usas un dominio real con Nginx manejando SSL:
        # listen 443 ssl;
        # server_name your_domain.com;
        # ssl_certificate /etc/nginx/certs/your_cert.crt;
        # ssl_certificate_key /etc/nginx/certs/your_key.key;


        # Reemplaza 'sunfish-causal-optionally.ngrok-free.app' con tu dominio real de ngrok
        server_name sunfish-causal-optionally.ngrok-free.app; 

        # Configuración para el frontend (React/Next.js/etc.)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade; # Para evitar cachear WebSockets
        }

        # Configuración para los endpoints RESTful de la API (ej. /api/create_room)
        location /api/ {
            proxy_pass http://backend_app; # Usa el upstream definido
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade; # Aunque no es WebSocket, es buena práctica
            proxy_set_header Connection 'keep-alive'; # Mejor para HTTP si no es WebSocket
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; # Para que Flask sepa el protocolo original
            proxy_cache_bypass $http_upgrade;
        }

        # Configuración ESPECÍFICA y CORREGIDA para Socket.IO
        # El trailing slash en proxy_pass es CRÍTICO si la location NO tiene trailing slash
        # O, para /socket.io, lo más sencillo es que proxy_pass sea la raíz del upstream
        # y dejar que Socket.IO maneje el subpath /socket.io
        location /socket.io { # Sin trailing slash
            proxy_pass http://backend_app; # Pasa a la raíz del upstream, no a /socket.io/socket.io
            proxy_http_version 1.1;
            proxy_buffering off; # Desactiva el buffering para baja latencia en tiempo real
            
            # Encabezados esenciales para WebSockets y Long-Polling
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade"; # OJO: "Upgrade" con U mayúscula para WebSocket

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; # Indispensable para Flask-SocketIO cuando está detrás de un proxy HTTPS

            # Aumentar timeouts para conexiones long-polling de Socket.IO
            # Estos timeouts son importantes para evitar 499 (Client Closed Request)
            # cuando el cliente espera una respuesta por mucho tiempo en polling.
            proxy_read_timeout 86400s;  # 24 horas (ajusta si es demasiado largo)
            proxy_send_timeout 86400s;
            proxy_connect_timeout 86400s;
        }
    }
}